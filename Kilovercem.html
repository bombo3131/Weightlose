*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}

.sw{position:relative;width:220px;height:220px;margin:14px auto 0;z-index:1}

.c{text-align:center}
.name{font-size:26px;font-weight:800;margin:6px 0}
.rar{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;border:1.5px solid currentColor}
.bar{height:18px;background:var(--card);border-radius:99px;overflow:hidden;margin:14px 0 4px}
.fill{height:100%;background:var(--hp);width:100%;transition:width .5s}
.hpt{font-size:13px;color:var(--muted);text-align:center}
.shake{animation:sh .4s}
@keyframes sh{20%{transform:translateX(-10px) rotate(-4deg)}50%{transform:translateX(10px) rotate(4deg)}80%{transform:translateX(-6px)}}
.slash{position:absolute;left:-10%;top:45%;width:120%;height:6px;background:linear-gradient(90deg,transparent,#fff,#ff2a2a,transparent);transform:rotate(-35deg) scaleX(0);animation:sl .4s forwards;pointer-events:none}
@keyframes sl{50%{transform:rotate(-35deg) scaleX(1);opacity:1}100%{transform:rotate(-35deg) scaleX(1);opacity:0}}
.drop{position:absolute;width:6px;height:6px;background:#c1121f;animation:dr .9s forwards;pointer-events:none}
@keyframes dr{to{transform:translateY(90px);opacity:0}}
h2{font-size:15px;margin:20px 0 8px;color:var(--muted);font-weight:600}
.task{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);color:var(--text);border:2px solid transparent;border-radius:14px;padding:14px;margin-bottom:8px;font-size:16px;text-align:left;cursor:pointer;font-family:inherit}
.task .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:16px}
.task.done{border-color:var(--ok);opacity:.8}
.task.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.task.done .t{text-decoration:line-through}
.t{flex:1}.dmg{font-size:13px;color:var(--hp);font-weight:700}
.win{display:none;text-align:center;background:var(--card);border:2px solid var(--ok);border-radius:14px;padding:14px;margin-top:12px}
.win.on{display:block}
.win b{color:var(--ok);font-size:18px}
#cd{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:6px}
.tabs{position:sticky;bottom:0;margin:24px -16px 0;display:flex;background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px);border-top:2px solid var(--accent);z-index:4}
.tabs button{flex:1;padding:14px;border:0;background:none;color:var(--muted);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.tabs button.on{color:var(--accent)}
.view{display:none}.view.on{display:block;flex:1}
#intro{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:9}
#intro.on{display:flex}
#intro h1{font-size:24px;font-weight:600;margin:0 0 18px;min-height:32px}
#reveal{opacity:0;transition:opacity .8s}#reveal.on{opacity:1}
#go{margin-top:26px;background:var(--accent);color:#fff;border:0;border-radius:14px;padding:14px 28px;font-size:17px;font-weight:700;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s;font-family:inherit}
#go.on{opacity:1;pointer-events:auto}
.av{width:110px;height:110px;border-radius:50%;background:var(--card);margin:6px auto;display:grid;place-items:center;font-size:44px;overflow:hidden;cursor:pointer;border:3px solid var(--accent)}
.av img{width:100%;height:100%;object-fit:cover}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=number]{width:100%;padding:12px;border-radius:12px;border:2px solid var(--card);background:var(--card);color:var(--text);font-size:16px;font-family:inherit}
.row2{display:flex;gap:10px}.row2>div{flex:1}
.kg{text-align:center;margin-top:12px;color:var(--muted);font-size:14px}
.h{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:8px 12px;margin-bottom:6px;font-size:14px}
.h canvas{width:40px;height:40px;image-rendering:pixelated;flex:none}
.h .x{flex:1}.h small{color:var(--muted);display:block}
#v1 .c{position:relative;overflow:hidden;border-radius:20px;margin-top:10px;padding:8px 0 14px;color:#f1eefc;border:2px solid #2d2548;background:linear-gradient(to top,#2a2140 0 20%,transparent 20%),repeating-linear-gradient(0deg,transparent 0 26px,rgba(255,255,255,.05) 26px 28px),radial-gradient(ellipse at 50% 35%,#3d2f63 0%,#1b1530 75%)}
#v1 .c::before,#v1 .c::after{content:'';position:absolute;top:22px;width:12px;height:12px;border-radius:50%;background:#ffb347;box-shadow:0 0 26px 12px rgba(255,150,40,.5);animation:fl .18s infinite alternate}
#v1 .c::before{left:22px}#v1 .c::after{right:22px;animation-delay:.09s}
@keyframes fl{to{opacity:.65;transform:scale(.88)}}
.aura{position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,var(--ac,#7c5cff) 0%,transparent 62%);opacity:.38;animation:pu 2.4s ease-in-out infinite}
@keyframes pu{50%{opacity:.6;transform:scale(1.08)}}
.shd{position:absolute;left:18%;right:18%;bottom:-2px;height:16px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(5px)}
.bd{position:absolute;inset:0;animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 0 10px var(--ac,transparent))}
@keyframes bob{50%{transform:translateY(-7px) scale(1.02)}}
#mc.hitfx{animation:hf .5s}
@keyframes hf{0%{filter:brightness(3) saturate(0);transform:translateX(-14px) rotate(-6deg)}25%{filter:brightness(1.6) sepia(1) hue-rotate(-50deg) saturate(7);transform:translateX(14px) rotate(6deg)}60%{transform:translateX(-7px)}100%{filter:none;transform:none}}
.slash{position:absolute;left:-12%;width:124%;height:8px;border-radius:8px;background:linear-gradient(90deg,transparent,#fff 40%,#ff2a2a 60%,transparent);box-shadow:0 0 14px 3px #ff2a2a;transform:rotate(var(--a,-35deg)) scaleX(0);opacity:0;animation:sl2 .45s forwards;pointer-events:none;z-index:2}
@keyframes sl2{30%{opacity:1}60%{transform:rotate(var(--a,-35deg)) scaleX(1);opacity:1}100%{transform:rotate(var(--a,-35deg)) scaleX(1);opacity:0}}
.num{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:36px;font-weight:900;color:#fff;text-shadow:0 0 8px #e5484d,3px 3px 0 #8f0f1a;animation:nm .9s forwards;pointer-events:none;z-index:3}
@keyframes nm{to{transform:translate(-50%,-70px) scale(1.35);opacity:0}}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 40%,rgba(229,72,77,.6));animation:vg .45s forwards;z-index:7}
@keyframes vg{to{opacity:0}}
.bshake{animation:bs .32s}
@keyframes bs{25%{transform:translate(5px,-4px)}50%{transform:translate(-5px,4px)}75%{transform:translate(3px,2px)}}
</style>
</head>

 if(S.done.length===mon().tasks.length){S.won=true;S.kills++;S.streak=(S.lastWin===yest())?S.streak+1:1;S.lastWin=S.date}
 rec();save();render();if(add)hit()}
function tick(){if(!S.won)return;var n=new Date(),e=new Date(n);e.setHours(24,0,0,0);var s=Math.max(0,Math.floor((e-n)/1000));
 document.getElementById("cd").textContent=pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60);
 if(S.date!==today()){ensureDay();render();intro()}}
setInterval(tick,1000);
function intro(){var m=mon(),el=document.getElementById("intro"),h=document.getElementById("ih"),txt="Today’s enemy is...",n=0;
 el.classList.add("on");spr(m,document.getElementById("ic"));
 document.getElementById("iname").textContent=m.name;
 var ir=document.getElementById("irar");ir.textContent=m.rarity;ir.style.color=m.color;
 document.getElementById("reveal").classList.remove("on");document.getElementById("go").classList.remove("on");h.textContent="";
 var iv=setInterval(function(){n++;h.textContent=txt.slice(0,n);if(n>=txt.length){clearInterval(iv);
  setTimeout(function(){document.getElementById("reveal").classList.add("on");setTimeout(function(){document.getElementById("go").classList.add("on")},700)},500)}},60);
 document.getElementById("go").onclick=function(){el.classList.remove("on");S.intro=true;save()}}
function tab(n){document.getElementById("v1").classList.toggle("on",n===1);document.getElementById("v2").classList.toggle("on",n===2);
 document.getElementById("t1").classList.toggle("on",n===1);document.getElementById("t2").classList.toggle("on",n===2);if(n===2)profile()}
document.getElementById("t1").onclick=function(){tab(1)};document.getElementById("t2").onclick=function(){tab(2)};
function profile(){
 document.getElementById("pn").value=S.name||"";document.getElementById("pw0").value=S.w0;document.getElementById("pw1").value=S.w1;
 var av=document.getElementById("av");av.innerHTML=S.photo?'<img src="'+S.photo+'" alt="">':"👤";kg();
 var box=document.getElementById("hist");box.innerHTML="";
 Object.keys(S.hist).sort().reverse().forEach(function(d){var h=S.hist[d],m=get(h.m),row=document.createElement("div"),cv=document.createElement("canvas");
  row.className="h";spr(m,cv);row.appendChild(cv);
  var st=h.w?"✅ Yendin":(d===S.date?"⏳ Devam ediyor":"❌ Kaçtı");
  var x=document.createElement("div");x.className="x";x.innerHTML=m.name+"<small>"+d.split("-").reverse().join(".")+" · "+h.d+"/"+h.t+" görev</small>";
  var s=document.createElement("div");s.textContent=st;row.appendChild(x);row.appendChild(s);box.appendChild(row)})}
function kg(){var a=parseFloat(S.w0),b=parseFloat(S.w1),el=document.getElementById("kg");
 el.textContent=(a&&b)?("Hedefe "+Math.abs(a-b).toFixed(1).replace(".0","")+" kg "+(a>b?"verilecek":"alınacak")+" ("+a+" → "+b+" kg)"):"Kilolarını gir, hedefin burada görünsün.";}
function bind(id,key){document.getElementById(id).oninput=function(){S[key]=this.value;save();kg();if(key==="name")render()}}
bind("pn","name");bind("pw0","w0");bind("pw1","w1");
document.getElementById("av").onclick=function(){document.getElementById("file").click()};
document.getElementById("file").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement("canvas");c.width=c.height=160;var x=c.getContext("2d"),s=Math.min(im.width,im.height);
  x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);S.photo=c.toDataURL("image/jpeg",.8);save();profile()};im.src=r.result};r.readAsDataURL(f)};
document.addEventListener("visibilitychange",function(){if(!document.hidden){var d=S.date;ensureDay();if(d!==S.date){render();intro()}}});
S=load();ensureDay();render();if(!S.intro)intro();
</script>
</body>
